[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlist"
version = "0.1.0"
description = "A local, self-hosted job-search pipeline"
requires-python = ">=3.13"

# Exact pins only (D-17 / PLAT-04). No floating ranges: the resolved artefact
# set is the reviewable supply-chain surface.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.53",
    "alembic==1.20.0",
    "aiosqlite==0.22.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "structlog==26.1.0",
    # Tier-2 fuzzy dedup over the normalised (company, title, location) tuple
    # (D-31). Exact pin only, for the same supply-chain reason as every entry
    # above; the version was cleared by a blocking human checkpoint (T-02-04).
    "rapidfuzz==3.14.6",
    # CV fact-equivalence lane (CV-03): PDF page count and text extraction.
    # Exact pin only, cleared by a blocking human checkpoint (T-04-01).
    "pypdf==6.19.0",
    # `app/cv/factstore.py` loads cv.yaml via yaml.safe_load at module scope, so
    # this is a RUNTIME dependency (CV-01, D-66) — not the dev-only entry it was.
    "pyyaml==6.0.3",
    # Phase 8 (D-151 / PLAT-06): the in-process cron scheduler with a persistent
    # job store for the nightly run. 4.x is still alpha and out. Exact pin only,
    # cleared by a blocking human checkpoint (T-08-01).
    "apscheduler==3.11.3",
    # Acquisition: install JobSpy from git at a PINNED FULL SHA, never PyPI.
    # PyPI's python-jobspy 1.1.82 predates the pinned LinkedIn date-parsing fix.
    # The distribution is named `python-jobspy`, NOT `jobspy` (an unrelated PyPI
    # project); naming the wrong distribution makes pip report a misleading error.
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@fda080a373e8226f3fd60635323f5da9af9892b1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Neither excluded lane may run by default. `live` contacts hostile third-party
# boards; `latex` compiles through an engine that is deliberately absent from dev
# machines (it lives only in the container). The operator selects either lane
# explicitly with `pytest -m live` / `pytest -m latex`, which overrides addopts —
# the same shape scripts/run-probe.sh uses for `live`.
addopts = "-m 'not live and not latex'"
markers = [
    "live: contacts a live third-party board or the opencode server; operator-run only, never in CI",
    "latex: compiles LaTeX through the engine; requires the container image and a primed Tectonic cache — operator-run only, never in the hermetic default lane (D-69)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.Cookie",
]
