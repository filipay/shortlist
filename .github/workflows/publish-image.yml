# Build the app image and publish it to the GitHub Container Registry (ghcr.io).
#
# The image is built from the repo's Dockerfile, which is the same build
# `docker compose up --build` runs locally — so the published image and a local
# build cannot drift.
#
# Authentication uses the workflow's own `GITHUB_TOKEN`; no PAT or repository
# secret is needed. The package is created on first push and inherits the
# repository's visibility (private).
#
# Pull it with:
#   docker pull ghcr.io/filipay/shortlist:latest
#
# If you need to run the published image, mount the same volumes compose.yml
# does (./data, ./cv, ./artifacts) and set the same OPENCODE_* environment.

name: Publish image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Cancel a superseded build for the same ref, so a rapid pair of pushes cannot
# publish `latest` out of order.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # linux/amd64 only: the Dockerfile installs the x86_64-musl Tectonic build
      # and primes its package cache, so an arm64 build would fail outright.
      # Adding arm64 means installing Tectonic's aarch64 build too.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
