<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Search Copilot{% endblock %}</title>
    {# Vendored assets only — no CDN (UI-07). #}
    <link rel="stylesheet" href="/static/vendor/app.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <h1>Job Search Copilot</h1>
      <p class="tagline">One ranked, review-ready queue.</p>
    </header>
    <main id="content">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
