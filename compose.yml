# Local-only deployment (PLAT-01).
#
# Deliberately absent: an `opencode` service, a `depends_on` on one, and any
# published 4096 port. The opencode server is external and user-managed (D-05);
# nothing in `docker compose up` may depend on an LLM backend being reachable
# (D-08). `extra_hosts` makes the default OPENCODE_BASE_URL work on Linux.
services:
  app:
    build: .
    ports: ["8000:8000"] # v1 is local-only; do not expose beyond the host
    volumes:
      - ./data:/data # jobsearch.db (+ -wal, -shm) — back up the WAL too (M8)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://host.docker.internal:4096}
      # The default must accept a forced tool call (opencode forces
      # toolChoice=required for a schema-constrained call). See app/config.py.
      - OPENCODE_MODEL=${OPENCODE_MODEL:-minimax-m3}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-} # from an uncommitted .env
      - DATABASE_URL_ASYNC=sqlite+aiosqlite:////data/jobsearch.db
      - DATABASE_URL_SYNC=sqlite:////data/jobsearch.db # Alembic uses this
      # Phase-2 tuning knobs, forwarded explicitly so a host `.env` actually
      # reaches the container. Compose uses `.env` only for ${...} substitution,
      # and the image contains no `.env` (Dockerfile does not COPY it, and only
      # ./data is mounted), so without these passthroughs the in-code defaults
      # silently win and a host-side override appears to be ignored.
      - DEDUP_FUZZY_THRESHOLD=${DEDUP_FUZZY_THRESHOLD:-88}
      - DEDUP_POSTED_WINDOW_DAYS=${DEDUP_POSTED_WINDOW_DAYS:-90}
      - STALE_AFTER_DAYS=${STALE_AFTER_DAYS:-14}
      - QUEUE_PAGE_SIZE=${QUEUE_PAGE_SIZE:-25}
      # Phase-3 opencode budget, forwarded for the same reason as the Phase-2
      # knobs above. OPENCODE_TIMEOUT_SECONDS had never been forwarded at all —
      # the identical defect class — so it is fixed here alongside its three
      # siblings. Every default matches app/config.py exactly.
      - OPENCODE_TIMEOUT_SECONDS=${OPENCODE_TIMEOUT_SECONDS:-5}
      - OPENCODE_COMPLETION_TIMEOUT_SECONDS=${OPENCODE_COMPLETION_TIMEOUT_SECONDS:-120}
      - OPENCODE_MAX_RETRIES=${OPENCODE_MAX_RETRIES:-2}
      - OPENCODE_STRUCTURED_RETRY_COUNT=${OPENCODE_STRUCTURED_RETRY_COUNT:-2}
    command: ["./entrypoint.sh"]
