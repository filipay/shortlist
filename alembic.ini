# Alembic configuration.
#
# The database URL is deliberately NOT set here. `alembic/env.py` resolves it
# from `app.config.settings.database_url_sync`, so the sync driver is the one
# configured surface (RESEARCH §Migration 0001 Mechanics 4) and never derived
# from the async URL by string surgery.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
